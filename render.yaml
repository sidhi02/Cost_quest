# Cost Quest: free demo Flask deployment.
# SQLite data is ephemeral and can be lost on restart or redeploy.
services:
  - type: web
    name: cost-quest
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /tmp/costquest.sqlite3
      - key: FLASK_DEBUG
        value: '0'
      - key: CSRF_ENABLED
        value: '1'
      - key: AI_SEMANTIC_ENABLED
        value: '0'
      - key: AI_CROSS_ENCODER_ENABLED
        value: '0'
      - key: AI_SIAMESE_ENABLED
        value: '0'
      - key: AI_CLIP_ENABLED
        value: '0'
